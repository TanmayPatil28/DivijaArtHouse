<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="blooming-succulent-mini-cactus-pot-v1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5FAF5"/>
      <stop offset="100%" stop-color="#E3EFE3"/>
    </linearGradient>
    <radialGradient id="blooming-succulent-mini-cactus-pot-v1-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E3EFE3" stop-opacity="0"/>
    </radialGradient>
    <filter id="blooming-succulent-mini-cactus-pot-v1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3D1A10" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="url(#blooming-succulent-mini-cactus-pot-v1-bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#blooming-succulent-mini-cactus-pot-v1-glow)"/>
  <rect x="25" y="25" width="750" height="750" rx="20" fill="none" stroke="#F875AA" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>

  <!-- Brand Label Watermark -->
  <g transform="translate(60, 70)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#A32D3B" letter-spacing="1.5">DIVIJA ART HOUSE</text>
    <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="12" fill="#666666" letter-spacing="0.5">Handcrafted Everlasting Blooms</text>
  </g>

  <!-- Product Title &amp; View Note -->
  <g transform="translate(60, 740)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Blooming Succulent &amp; Mini Cactus Pot</text>
    <text x="0" y="20" font-family="'Poppins', sans-serif" font-size="12" fill="#872430">Mini Cactus with Crochet Floret</text>
  </g>

  <!-- Authentic Handcrafted Vector Artwork -->
  <g filter="url(#blooming-succulent-mini-cactus-pot-v1-shadow)">
    
      <!-- Potted Bloom Composition -->
      <!-- Ceramic Pot -->
      <g transform="translate(400, 520)">
        <path d="M-130 -100 L-95 140 C-90 155 -75 165 -60 165 L60 165 C75 165 90 155 95 140 L130 -100 Z" fill="#E8D7C5"/>
        <ellipse cx="0" cy="-100" rx="140" ry="24" fill="#F4EAE0" stroke="#BA9E84" stroke-width="3"/>
        <ellipse cx="0" cy="-100" rx="125" ry="18" fill="#52392B"/>
        <!-- Textured Pot Ribbons -->
        <path d="M-85 -10 Q0 15 85 -10" fill="none" stroke="#BA9E84" stroke-width="4" stroke-linecap="round"/>
        <path d="M-75 40 Q0 65 75 40" fill="none" stroke="#BA9E84" stroke-width="4" stroke-linecap="round"/>
        <!-- Kawaii Smile on Pot -->
        <circle cx="-25" cy="5" r="4" fill="#52392B"/>
        <circle cx="25" cy="5" r="4" fill="#52392B"/>
        <path d="M-12 18 Q0 28 12 18" fill="none" stroke="#52392B" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="-38" cy="15" r="7" fill="#F8B4BD" opacity="0.6"/>
        <circle cx="38" cy="15" r="7" fill="#F8B4BD" opacity="0.6"/>
      </g>

      <!-- Stems and Crochet Foliage -->
      <path d="M400 420 Q400 290 400 220" fill="none" stroke="#557A46" stroke-width="12" stroke-linecap="round"/>
      <path d="M370 420 Q310 350 280 290" fill="none" stroke="#557A46" stroke-width="10" stroke-linecap="round"/>
      <path d="M430 420 Q490 350 520 290" fill="none" stroke="#557A46" stroke-width="10" stroke-linecap="round"/>

      <!-- Leaves -->
      <path d="M340 370 C270 360 250 310 280 295 C310 295 330 340 340 370 Z" fill="#7FA968"/>
      <path d="M460 370 C530 360 550 310 520 295 C490 295 470 340 460 370 Z" fill="#7FA968"/>

      <!-- Primary Pot Bloom -->
      <g transform="translate(400, 200)">
        <g fill="#609966" stroke="#40534C" stroke-width="2.5">
          <ellipse cx="0" cy="-60" rx="22" ry="34"/>
          <ellipse cx="42" cy="-42" rx="22" ry="34" transform="rotate(45 42 -42)"/>
          <ellipse cx="60" cy="0" rx="34" ry="22"/>
          <ellipse cx="42" cy="42" rx="22" ry="34" transform="rotate(-45 42 42)"/>
          <ellipse cx="0" cy="60" rx="22" ry="34"/>
          <ellipse cx="-42" cy="42" rx="22" ry="34" transform="rotate(45 -42 42)"/>
          <ellipse cx="-60" cy="0" rx="34" ry="22"/>
          <ellipse cx="-42" cy="-42" rx="22" ry="34" transform="rotate(-45 -42 -42)"/>
        </g>
        <circle cx="0" cy="0" r="32" fill="#40534C"/>
        <circle cx="0" cy="0" r="24" fill="#F875AA"/>
        <circle cx="0" cy="0" r="18" fill="none" stroke="#3D2412" stroke-width="2.5" stroke-dasharray="4,4"/>
      </g>
    
  </g>
</svg>