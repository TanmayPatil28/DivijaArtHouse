<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="golden-memories-keepsake-wooden-gift-hamper-v2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F4EB"/>
      <stop offset="100%" stop-color="#EBDDC7"/>
    </linearGradient>
    <radialGradient id="golden-memories-keepsake-wooden-gift-hamper-v2-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EBDDC7" stop-opacity="0"/>
    </radialGradient>
    <filter id="golden-memories-keepsake-wooden-gift-hamper-v2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3D1A10" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="url(#golden-memories-keepsake-wooden-gift-hamper-v2-bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#golden-memories-keepsake-wooden-gift-hamper-v2-glow)"/>
  

  

  

  <!-- Authentic Handcrafted Vector Artwork -->
  <g filter="url(#golden-memories-keepsake-wooden-gift-hamper-v2-shadow)">
    
      <!-- Keepsake Gift Box Composition -->
      <g transform="translate(400, 400) scale(1.25)">
        <!-- Box Base (Isometric 3D) -->
        <polygon points="-200,-50 0,25 200,-50 0,-125" fill="#E8D5BF"/>
        <!-- Straw filling -->
        <path d="M-160,-55 Q-90,-30 0,-50 T160,-60" fill="none" stroke="#D1B89F" stroke-width="4" stroke-dasharray="6,4"/>
        <path d="M-140,-40 Q0,-15 140,-45" fill="none" stroke="#F1DEC9" stroke-width="5" stroke-dasharray="7,5"/>
        <!-- Outer Box Walls -->
        <polygon points="-200,-50 0,25 0,160 -200,85" fill="#7A4B1F"/>
        <polygon points="0,25 200,-50 200,85 0,160" fill="#BD8B52"/>

        <!-- Front Red Velvet Ribbon -->
        <path d="M-200,18 L0,92 L200,18" fill="none" stroke="#A32D3B" stroke-width="18" stroke-linecap="round"/>
        <path d="M0,25 L0,160" fill="none" stroke="#A32D3B" stroke-width="18"/>

        <!-- Large Front Silk Bow -->
        <g transform="translate(0, 92)">
          <path d="M-40 -20 C-65 -45 -70 0 -40 18 C-20 30 -8 8 0 0 C8 8 20 30 40 18 C70 0 65 -45 40 -20 C18 -3 8 3 0 0 C-8 3 -18 -3 -40 -20 Z" fill="#872430"/>
          <circle cx="0" cy="0" r="14" fill="#521017"/>
        </g>
      </g>

      <!-- Contents Nestled in Box -->
      <!-- Scented Candle Jar (Right) -->
      <g transform="translate(480, 360)">
        <rect x="-35" y="-30" width="70" height="60" rx="8" fill="#F7EFE6" stroke="#D9C2AB" stroke-width="2"/>
        <ellipse cx="0" cy="-30" rx="35" ry="10" fill="#FFFDF9" stroke="#D9C2AB" stroke-width="1.5"/>
        <line x1="0" y1="-30" x2="0" y2="-42" stroke="#4A2E13" stroke-width="2.5"/>
        <path d="M0 -42 C-6 -54 0 -66 0 -66 C0 -66 6 -54 0 -42 Z" fill="#FDB833"/>
        <rect x="-22" y="-12" width="44" height="24" rx="3" fill="#FFFDF9" stroke="#E3C4B6" stroke-width="1"/>
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#A32D3B" stroke-width="2"/>
      </g>

      <!-- Large Handcrafted Blossom (Left) -->
      <g transform="translate(320, 350)">
        <circle cx="0" cy="0" r="55" fill="#7A4B1F"/>
        <circle cx="0" cy="0" r="38" fill="#BD8B52"/>
        <circle cx="0" cy="0" r="20" fill="#C94252"/>
        <circle cx="0" cy="0" r="8" fill="#521017"/>
        <circle cx="0" cy="0" r="44" fill="none" stroke="#FFFDF9" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.6"/>
      </g>
    
  </g>
</svg>