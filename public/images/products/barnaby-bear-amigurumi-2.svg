<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="barnaby-the-bear-with-sunflower-amigurumi-v2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCE7D2"/>
    </linearGradient>
    <radialGradient id="barnaby-the-bear-with-sunflower-amigurumi-v2-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FCE7D2" stop-opacity="0"/>
    </radialGradient>
    <filter id="barnaby-the-bear-with-sunflower-amigurumi-v2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3D1A10" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="url(#barnaby-the-bear-with-sunflower-amigurumi-v2-bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#barnaby-the-bear-with-sunflower-amigurumi-v2-glow)"/>
  <rect x="25" y="25" width="750" height="750" rx="20" fill="none" stroke="#A32D3B" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>

  <!-- Brand Label Watermark -->
  <g transform="translate(60, 70)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#A32D3B" letter-spacing="1.5">DIVIJA ART HOUSE</text>
    <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="12" fill="#666666" letter-spacing="0.5">Handcrafted Everlasting Blooms</text>
  </g>

  <!-- Product Title &amp; View Note -->
  <g transform="translate(60, 740)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Barnaby The Bear With Sunflower Amigurumi</text>
    <text x="0" y="20" font-family="'Poppins', sans-serif" font-size="12" fill="#872430">Sitting Mascot with Mini Sunflower</text>
  </g>

  <!-- Authentic Handcrafted Vector Artwork -->
  <g filter="url(#barnaby-the-bear-with-sunflower-amigurumi-v2-shadow)">
    
      <!-- Amigurumi Bear Mascot Composition -->
      <g transform="translate(400, 390)">
        <!-- Ears -->
        <circle cx="-100" cy="-80" r="42" fill="#F9B233"/>
        <circle cx="-100" cy="-80" r="24" fill="#FFFDF9"/>
        <circle cx="100" cy="-80" r="42" fill="#F9B233"/>
        <circle cx="100" cy="-80" r="24" fill="#FFFDF9"/>

        <!-- Body -->
        <ellipse cx="0" cy="160" rx="120" ry="110" fill="#F9B233"/>
        <ellipse cx="0" cy="165" rx="70" ry="65" fill="#FFFDF9"/>
        <path d="M-30 165 Q0 180 30 165" fill="none" stroke="#D1B297" stroke-width="3" stroke-dasharray="4,4"/>

        <!-- Paws / Feet -->
        <ellipse cx="-85" cy="245" rx="38" ry="28" fill="#F9B233"/>
        <circle cx="-85" cy="245" r="16" fill="#FFFDF9"/>
        <ellipse cx="85" cy="245" rx="38" ry="28" fill="#F9B233"/>
        <circle cx="85" cy="245" r="16" fill="#FFFDF9"/>

        <!-- Head -->
        <circle cx="0" cy="0" r="115" fill="#F9B233"/>
        <circle cx="0" cy="0" r="102" fill="none" stroke="#8A5A30" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>

        <!-- Snout -->
        <ellipse cx="0" cy="30" rx="50" ry="36" fill="#FFFDF9"/>
        <ellipse cx="0" cy="16" rx="15" ry="10" fill="#3D2412"/>
        <path d="M0 26 L0 42 M-12 42 Q0 52 12 42" fill="none" stroke="#3D2412" stroke-width="4" stroke-linecap="round"/>

        <!-- Eyes -->
        <ellipse cx="-50" cy="-5" rx="11" ry="14" fill="#1A110B"/>
        <circle cx="-53" cy="-9" r="4.5" fill="#FFFFFF"/>
        <ellipse cx="50" cy="-5" rx="11" ry="14" fill="#1A110B"/>
        <circle cx="47" cy="-9" r="4.5" fill="#FFFFFF"/>

        <!-- Blush -->
        <ellipse cx="-80" cy="26" rx="16" ry="9" fill="#F49E9E" opacity="0.75"/>
        <ellipse cx="80" cy="26" rx="16" ry="9" fill="#F49E9E" opacity="0.75"/>

        <!-- Arms Hugging Sunflower -->
        <ellipse cx="-90" cy="115" rx="28" ry="42" transform="rotate(30 -90 115)" fill="#F9B233"/>
        <ellipse cx="70" cy="125" rx="28" ry="42" transform="rotate(-30 70 125)" fill="#F9B233"/>

        <!-- Mini Sunflower in Paw -->
        <g transform="translate(65, 120)">
          <g fill="#A67345" stroke="#DE8500" stroke-width="2">
            <circle cx="0" cy="-35" r="12"/>
            <circle cx="25" cy="-25" r="12"/>
            <circle cx="35" cy="0" r="12"/>
            <circle cx="25" cy="25" r="12"/>
            <circle cx="0" cy="35" r="12"/>
            <circle cx="-25" cy="25" r="12"/>
            <circle cx="-35" cy="0" r="12"/>
            <circle cx="-25" cy="-25" r="12"/>
          </g>
          <circle cx="0" cy="0" r="22" fill="#523218"/>
          <circle cx="0" cy="0" r="17" fill="none" stroke="#DFBD8B" stroke-width="2" stroke-dasharray="3,3"/>
        </g>
      </g>
    
  </g>
</svg>