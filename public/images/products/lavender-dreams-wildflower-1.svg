<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="lavender-dreams-everlasting-wildflower-bunch-v1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7FD"/>
      <stop offset="100%" stop-color="#EFE7F8"/>
    </linearGradient>
    <radialGradient id="lavender-dreams-everlasting-wildflower-bunch-v1-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EFE7F8" stop-opacity="0"/>
    </radialGradient>
    <filter id="lavender-dreams-everlasting-wildflower-bunch-v1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3D1A10" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="url(#lavender-dreams-everlasting-wildflower-bunch-v1-bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#lavender-dreams-everlasting-wildflower-bunch-v1-glow)"/>
  <rect x="25" y="25" width="750" height="750" rx="20" fill="none" stroke="#EADEF7" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>

  <!-- Brand Label Watermark -->
  <g transform="translate(60, 70)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#A32D3B" letter-spacing="1.5">DIVIJA ART HOUSE</text>
    <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="12" fill="#666666" letter-spacing="0.5">Handcrafted Everlasting Blooms</text>
  </g>

  <!-- Product Title & View Note -->
  <g transform="translate(60, 740)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Lavender Dreams Wildflower Bunch</text>
    <text x="0" y="20" font-family="'Poppins', sans-serif" font-size="12" fill="#872430">Lilac Wildflowers & Sprigs</text>
  </g>

  <!-- Authentic Handcrafted Vector Artwork -->
  <g filter="url(#lavender-dreams-everlasting-wildflower-bunch-v1-shadow)">
    
      <!-- Wrapping Paper Cone -->
      <path d="M400 680 L220 380 C220 380 320 420 400 420 C480 420 580 380 580 380 Z" fill="#DFC8B2"/>
      <path d="M220 380 L400 680 L430 415 C360 422 280 405 220 380 Z" fill="#997A5B" opacity="0.35"/>
      <path d="M280 430 Q400 460 520 430" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
      
      <!-- Foliage Stems -->
      <path d="M260 350 C180 280 200 200 280 230 C300 250 280 330 260 350 Z" fill="#6B8E23"/>
      <path d="M540 350 C620 280 600 200 520 230 C500 250 520 330 540 350 Z" fill="#556B2F"/>
      

      <!-- Centerpiece Crochet Blooms -->
      <!-- Left Bloom -->
      <g transform="translate(310, 310)">
        <circle cx="0" cy="0" r="70" fill="#9C7AC2"/>
        <circle cx="0" cy="0" r="50" fill="#6B4A94"/>
        <circle cx="0" cy="0" r="30" fill="#EADEF7"/>
        <circle cx="0" cy="0" r="12" fill="#551B22"/>
        <circle cx="0" cy="0" r="58" fill="none" stroke="#FFFDF9" stroke-width="2.5" stroke-dasharray="5,5" opacity="0.6"/>
      </g>

      <!-- Right Bloom -->
      <g transform="translate(480, 290)">
        <circle cx="0" cy="0" r="75" fill="#6B4A94"/>
        <circle cx="0" cy="0" r="52" fill="#9C7AC2"/>
        <circle cx="0" cy="0" r="28" fill="#EADEF7"/>
        <circle cx="0" cy="0" r="10" fill="#3A1700"/>
        <circle cx="0" cy="0" r="62" fill="none" stroke="#FFFDF9" stroke-width="2.5" stroke-dasharray="5,5" opacity="0.6"/>
      </g>

      <!-- Crown Center Bloom -->
      <g transform="translate(400, 230)">
        <circle cx="0" cy="0" r="65" fill="#9C7AC2"/>
        <!-- Petal scallops -->
        <circle cx="0" cy="-45" r="18" fill="#9C7AC2" stroke="#EADEF7" stroke-width="2"/>
        <circle cx="40" cy="-20" r="18" fill="#9C7AC2" stroke="#EADEF7" stroke-width="2"/>
        <circle cx="35" cy="30" r="18" fill="#9C7AC2" stroke="#EADEF7" stroke-width="2"/>
        <circle cx="-35" cy="30" r="18" fill="#9C7AC2" stroke="#EADEF7" stroke-width="2"/>
        <circle cx="-40" cy="-20" r="18" fill="#9C7AC2" stroke="#EADEF7" stroke-width="2"/>
        <circle cx="0" cy="0" r="35" fill="#6B4A94"/>
        <circle cx="0" cy="0" r="18" fill="#EADEF7"/>
      </g>

      <!-- Satin Ribbon Bow -->
      <g transform="translate(400, 560)">
        <path d="M-45 -20 C-85 -45 -95 10 -55 25 C-30 35 -10 12 0 0 C10 12 30 35 55 25 C95 10 85 -45 45 -20 C22 -8 10 5 0 0 C-10 5 -22 -8 -45 -20 Z" fill="#A32D3B"/>
        <circle cx="0" cy="0" r="14" fill="#67111D"/>
        <path d="M-10 10 C-25 45 -45 90 -60 120" fill="none" stroke="#A32D3B" stroke-width="9" stroke-linecap="round"/>
        <path d="M10 10 C25 45 45 90 60 120" fill="none" stroke="#A32D3B" stroke-width="9" stroke-linecap="round"/>
      </g>
    
  </g>
</svg>