<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="strawberry-blossom-crochet-hair-claw-clip-set-v2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F8DCE2"/>
    </linearGradient>
    <radialGradient id="strawberry-blossom-crochet-hair-claw-clip-set-v2-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F8DCE2" stop-opacity="0"/>
    </radialGradient>
    <filter id="strawberry-blossom-crochet-hair-claw-clip-set-v2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3D1A10" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="url(#strawberry-blossom-crochet-hair-claw-clip-set-v2-bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#strawberry-blossom-crochet-hair-claw-clip-set-v2-glow)"/>
  <rect x="25" y="25" width="750" height="750" rx="20" fill="none" stroke="#FFFDF9" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.6"/>

  <!-- Brand Label Watermark -->
  <g transform="translate(60, 70)">
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="bold" fill="#A32D3B" letter-spacing="1.5">DIVIJA ART HOUSE</text>
    <text x="0" y="24" font-family="'Poppins', sans-serif" font-size="12" fill="#666666" letter-spacing="0.5">Handcrafted Everlasting Blooms</text>
  </g>

  <!-- Product Title & View Note -->
  <g transform="translate(60, 740)">
    <text x="0" y="0" font-family="'Poppins', sans-serif" font-size="14" font-weight="600" fill="#1A1A1A">Strawberry Blossom Hair Claw Clip Set</text>
    <text x="0" y="20" font-family="'Poppins', sans-serif" font-size="12" fill="#872430">Side Grip & Spring Profile</text>
  </g>

  <!-- Authentic Handcrafted Vector Artwork -->
  <g filter="url(#strawberry-blossom-crochet-hair-claw-clip-set-v2-shadow)">
    
      <!-- Claw Clip Composition -->
      <g transform="translate(400, 380)">
        <!-- Acetate/Tortoise Clip Body -->
        <path d="M-150 -20 C-150 -80 150 -80 150 -20 C140 30 -140 30 -150 -20 Z" fill="#8B4513"/>
        <!-- Spring Gold Core -->
        <rect x="-24" y="-60" width="48" height="24" rx="6" fill="#DFBD8B" stroke="#A97E33" stroke-width="2"/>
        <!-- Interlocking Clip Teeth -->
        <g stroke="#8B4513" stroke-width="11" stroke-linecap="round">
          <line x1="-120" y1="20" x2="-120" y2="65"/>
          <line x1="-80" y1="20" x2="-80" y2="65"/>
          <line x1="-40" y1="20" x2="-40" y2="65"/>
          <line x1="0" y1="20" x2="0" y2="65"/>
          <line x1="40" y1="20" x2="40" y2="65"/>
          <line x1="80" y1="20" x2="80" y2="65"/>
          <line x1="120" y1="20" x2="120" y2="65"/>
        </g>
        
        <!-- Mounted Crochet Strawberry Accent -->
        <g transform="translate(-50, -25)">
          <path d="M0 -25 C25 -25 35 10 0 40 C-35 10 -25 -25 0 -25 Z" fill="#E63946"/>
          <circle cx="-8" cy="-5" r="2.5" fill="#FFFDF9"/>
          <circle cx="8" cy="-5" r="2.5" fill="#FFFDF9"/>
          <circle cx="0" cy="12" r="2.5" fill="#FFFDF9"/>
          <!-- Calyx -->
          <path d="M-18 -22 C-6 -16 0 -28 0 -28 C0 -28 6 -16 18 -22 C12 -12 0 -16 0 -16 C0 -16 -12 -12 -18 -22 Z" fill="#6DA653"/>
        </g>

        <!-- Mounted Crochet Daisy Blossom -->
        <g transform="translate(55, -25)">
          <circle cx="0" cy="-20" r="14" fill="#FFFDF9" stroke="#E3D7C9" stroke-width="2"/>
          <circle cx="18" cy="-6" r="14" fill="#FFFDF9" stroke="#E3D7C9" stroke-width="2"/>
          <circle cx="12" cy="16" r="14" fill="#FFFDF9" stroke="#E3D7C9" stroke-width="2"/>
          <circle cx="-12" cy="16" r="14" fill="#FFFDF9" stroke="#E3D7C9" stroke-width="2"/>
          <circle cx="-18" cy="-6" r="14" fill="#FFFDF9" stroke="#E3D7C9" stroke-width="2"/>
          <circle cx="0" cy="0" r="11" fill="#FFD166"/>
        </g>
      </g>
    
  </g>
</svg>