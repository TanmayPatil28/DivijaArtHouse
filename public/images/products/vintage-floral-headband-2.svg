<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="vintage-floral-crochet-headband-v2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F4"/>
      <stop offset="100%" stop-color="#EFE5DF"/>
    </linearGradient>
    <radialGradient id="vintage-floral-crochet-headband-v2-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EFE5DF" stop-opacity="0"/>
    </radialGradient>
    <filter id="vintage-floral-crochet-headband-v2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#3D1A10" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="800" height="800" fill="url(#vintage-floral-crochet-headband-v2-bg)"/>
  <circle cx="400" cy="400" r="350" fill="url(#vintage-floral-crochet-headband-v2-glow)"/>
  

  

  

  <!-- Authentic Handcrafted Vector Artwork -->
  <g filter="url(#vintage-floral-crochet-headband-v2-shadow)">
    
      <!-- Headband Composition -->
      <g transform="translate(400, 400) scale(1.25)">
        <!-- Flexible Arch -->
        <path d="M-200 120 C-200 -160 200 -160 200 120" fill="none" stroke="#E8D5BF" stroke-width="26" stroke-linecap="round"/>
        <path d="M-200 120 C-200 -160 200 -160 200 120" fill="none" stroke="#83C5BE" stroke-width="14" stroke-dasharray="10,8" stroke-linecap="round"/>

        <!-- Woven Crochet Floral Row on Arch -->
        <g transform="translate(-140, 10)">
          <circle cx="0" cy="0" r="26" fill="#E29578"/>
          <circle cx="0" cy="0" r="14" fill="#FFFDF9"/>
        </g>
        <g transform="translate(-70, -70)">
          <circle cx="0" cy="0" r="28" fill="#83C5BE"/>
          <circle cx="0" cy="0" r="16" fill="#FFFDF9"/>
        </g>
        <g transform="translate(0, -95)">
          <circle cx="0" cy="0" r="32" fill="#E29578"/>
          <circle cx="0" cy="0" r="18" fill="#FFFDF9"/>
          <circle cx="0" cy="0" r="7" fill="#A32D3B"/>
        </g>
        <g transform="translate(70, -70)">
          <circle cx="0" cy="0" r="28" fill="#83C5BE"/>
          <circle cx="0" cy="0" r="16" fill="#FFFDF9"/>
        </g>
        <g transform="translate(140, 10)">
          <circle cx="0" cy="0" r="26" fill="#E29578"/>
          <circle cx="0" cy="0" r="14" fill="#FFFDF9"/>
        </g>
      </g>
    
  </g>
</svg>