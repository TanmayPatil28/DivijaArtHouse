<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="discGradPots" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F5E3E6"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#discGradPots)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Potted Bloom Line-Art (Visiting Card 3rd Floret Style) -->
  <g stroke="#781D2C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Ceramic Terracotta Pot Silhouette -->
    <path d="M185 275 L315 275 L295 380 C290 395 280 405 265 405 L235 405 C220 405 210 395 205 380 Z" fill="#F8E7E9"/>
    <ellipse cx="250" cy="275" rx="68" ry="14" fill="#FCF3F5"/>

    <!-- Pot Accent Ribbon Groove -->
    <path d="M200 325 Q250 340 300 325" stroke="#C59A5A" stroke-width="8"/>
    <circle cx="250" cy="360" r="5" fill="#C59A5A" stroke="none"/>

    <!-- Central Floral Stem -->
    <path d="M250 270 L250 190" stroke-width="13"/>

    <!-- Botanical Leaves (Left &amp; Right) -->
    <path d="M250 240 C210 230 190 200 205 185 C225 190 240 220 250 240 Z" fill="#FBF0F2"/>
    <path d="M250 240 C290 230 310 200 295 185 C275 190 260 220 250 240 Z" fill="#FBF0F2"/>

    <!-- Blooming Tulip/Floret Crown -->
    <g transform="translate(250, 160)">
      <!-- Center Petal -->
      <path d="M0 -45 C-18 -15 -18 20 0 35 C18 20 18 -15 0 -45 Z" fill="#F7E2E6"/>
      <!-- Left Petal -->
      <path d="M0 35 C-35 30 -50 -10 -35 -35 C-20 -10 -10 15 0 35 Z"/>
      <!-- Right Petal -->
      <path d="M0 35 C35 30 50 -10 35 -35 C20 -10 10 15 0 35 Z"/>
      <!-- Core Stamen Dot -->
      <circle cx="0" cy="0" r="7" fill="#C59A5A" stroke="none"/>
    </g>
  </g>
</svg>
