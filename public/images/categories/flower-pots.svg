<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EFE6DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceramicPot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E6D8"/>
      <stop offset="50%" stop-color="#DFC8B2"/>
      <stop offset="100%" stop-color="#BA9E84"/>
    </linearGradient>
    <linearGradient id="daisyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="100%" stop-color="#E5A61E"/>
    </linearGradient>
    <linearGradient id="tulipPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAD8A"/>
      <stop offset="100%" stop-color="#E06941"/>
    </linearGradient>
    <linearGradient id="stemGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91B87F"/>
      <stop offset="100%" stop-color="#4C703B"/>
    </linearGradient>
    <filter id="potShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5A4030" flood-opacity="0.14"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgPot)"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#D1B89F" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="250" cy="230" r="170" fill="url(#sunGlow)"/>

  <!-- Potted Plant Group -->
  <g filter="url(#potShadow)">
    <!-- Soil mound inside rim -->
    <ellipse cx="250" cy="275" rx="85" ry="25" fill="#4B3426"/>
    <ellipse cx="250" cy="272" rx="78" ry="20" fill="#664634"/>

    <!-- Stems & Leaves -->
    <path d="M250 270 Q250 190 250 160" fill="none" stroke="url(#stemGreen)" stroke-width="8" stroke-linecap="round"/>
    <path d="M230 270 Q200 230 180 190" fill="none" stroke="url(#stemGreen)" stroke-width="7" stroke-linecap="round"/>
    <path d="M270 270 Q300 230 320 200" fill="none" stroke="url(#stemGreen)" stroke-width="7" stroke-linecap="round"/>

    <!-- Crochet Leaves with ribbed stitches -->
    <path d="M210 240 C160 230 150 200 170 190 C190 190 205 220 210 240 Z" fill="#759C63"/>
    <path d="M290 240 C340 230 350 200 330 190 C310 190 295 220 290 240 Z" fill="#759C63"/>

    <!-- Main Daisy Bloom (Center) -->
    <g transform="translate(250, 150)">
      <!-- Daisy Petals in Circle -->
      <g fill="#FFFDF9" stroke="#E3D7C9" stroke-width="1.5">
        <ellipse cx="0" cy="-40" rx="14" ry="22"/>
        <ellipse cx="28" cy="-28" rx="14" ry="22" transform="rotate(45 28 -28)"/>
        <ellipse cx="40" cy="0" rx="22" ry="14"/>
        <ellipse cx="28" cy="28" rx="14" ry="22" transform="rotate(-45 28 28)"/>
        <ellipse cx="0" cy="40" rx="14" ry="22"/>
        <ellipse cx="-28" cy="28" rx="14" ry="22" transform="rotate(45 -28 28)"/>
        <ellipse cx="-40" cy="0" rx="22" ry="14"/>
        <ellipse cx="-28" cy="-28" rx="14" ry="22" transform="rotate(-45 -28 -28)"/>
      </g>
      <!-- Center disc with crochet textured dots -->
      <circle cx="0" cy="0" r="22" fill="url(#daisyYellow)"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#D18E0B" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Cute Kawaii face -->
      <ellipse cx="-6" cy="-2" rx="2.5" ry="3.5" fill="#3D2914"/>
      <ellipse cx="6" cy="-2" rx="2.5" ry="3.5" fill="#3D2914"/>
      <path d="M-4 6 Q0 10 4 6" fill="none" stroke="#3D2914" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-10" cy="4" r="3" fill="#F8A090" opacity="0.7"/>
      <circle cx="10" cy="4" r="3" fill="#F8A090" opacity="0.7"/>
    </g>

    <!-- Side Tulip (Left) -->
    <g transform="translate(180, 185)">
      <path d="M-18 20 C-25 -5 -15 -25 0 -25 C15 -25 25 -5 18 20 Z" fill="url(#tulipPeach)"/>
      <path d="M-5 -25 C0 -15 0 -5 0 20 C0 -5 0 -15 5 -25" fill="none" stroke="#C4512B" stroke-width="1.5"/>
    </g>

    <!-- Side Lavender Spike (Right) -->
    <g transform="translate(320, 195)">
      <circle cx="0" cy="-18" r="8" fill="#B794D6"/>
      <circle cx="-5" cy="-8" r="8" fill="#9F73C7"/>
      <circle cx="5" cy="-8" r="8" fill="#9F73C7"/>
      <circle cx="-6" cy="2" r="8" fill="#B794D6"/>
      <circle cx="6" cy="2" r="8" fill="#8B5BB5"/>
      <circle cx="0" cy="12" r="8" fill="#7845A3"/>
    </g>

    <!-- Fluted Ceramic Pot Body -->
    <path d="M165 270 L185 410 C187 420 195 425 205 425 L295 425 C305 425 313 420 315 410 L335 270 Z" fill="url(#ceramicPot)"/>
    <!-- Pot Rim -->
    <ellipse cx="250" cy="270" rx="90" ry="14" fill="#E8D7C5" stroke="#BA9E84" stroke-width="2"/>
    <!-- Pot Embossed Wave Pattern / Stitches -->
    <path d="M190 320 Q220 330 250 320 Q280 310 310 320" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M195 350 Q225 360 250 350 Q275 340 305 350" fill="none" stroke="#FFFDF9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Subtle pot bottom base shadow -->
    <ellipse cx="250" cy="425" rx="55" ry="8" fill="#9E8166" opacity="0.5"/>
  </g>
</svg>
