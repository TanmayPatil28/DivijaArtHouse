<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGift" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF6F0"/>
      <stop offset="100%" stop-color="#F5E8E2"/>
    </linearGradient>
    <radialGradient id="boxGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F5E8E2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EADB"/>
      <stop offset="100%" stop-color="#D9BEA5"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B69B"/>
      <stop offset="100%" stop-color="#B28F70"/>
    </linearGradient>
    <linearGradient id="candleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF1E6"/>
      <stop offset="100%" stop-color="#D9C2AB"/>
    </linearGradient>
    <linearGradient id="ribbonSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA3343"/>
      <stop offset="100%" stop-color="#801C27"/>
    </linearGradient>
    <filter id="giftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#552B1E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgGift)"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#E3C4B6" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="250" cy="210" r="170" fill="url(#boxGlow)"/>

  <!-- Open Keepsake Gift Hamper Box Graphic -->
  <g filter="url(#giftShadow)">
    <!-- Base Box (Angled 3D Isometric View) -->
    <!-- Inner floor / filling straw -->
    <polygon points="120,240 250,290 380,240 250,200" fill="#EAD6C0"/>
    <!-- Crinkled paper shreds inside box -->
    <path d="M140 235 Q180 255 220 235 T300 245 T360 230" fill="none" stroke="#D8BD9F" stroke-width="3" stroke-dasharray="4,3"/>
    <path d="M150 245 Q200 265 250 245 T350 240" fill="none" stroke="#F1DEC9" stroke-width="4" stroke-dasharray="5,4"/>

    <!-- Left Box Outer Wall -->
    <polygon points="120,240 250,290 250,400 120,340" fill="url(#boxSide)"/>
    <!-- Right Box Outer Wall -->
    <polygon points="250,290 380,240 380,340 250,400" fill="url(#boxWood)"/>

    <!-- Inner Hamper Contents -->
    <!-- Item 1: Scented Jar Candle (Right) -->
    <g transform="translate(305, 205)">
      <rect x="-24" y="-20" width="48" height="42" rx="6" fill="url(#candleGlass)"/>
      <ellipse cx="0" cy="-20" rx="24" ry="7" fill="#FBF5ED" stroke="#D9C2AB" stroke-width="1"/>
      <ellipse cx="0" cy="-20" rx="20" ry="5" fill="#E8D5BF"/>
      <!-- Wick &amp; Flame -->
      <line x1="0" y1="-20" x2="0" y2="-28" stroke="#3D2914" stroke-width="2"/>
      <path d="M0 -28 C-4 -36 0 -44 0 -44 C0 -44 4 -36 0 -28 Z" fill="#FDB833"/>
      <!-- Label on Candle -->
      <rect x="-16" y="-8" width="32" height="18" rx="2" fill="#FFFDF9" stroke="#E3C4B6" stroke-width="1"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#A32D3B" stroke-width="1.5"/>
    </g>

    <!-- Item 2: Large Crochet Peony / Rose in Box (Left) -->
    <g transform="translate(195, 205)">
      <circle cx="0" cy="0" r="38" fill="#F8B4BD"/>
      <circle cx="0" cy="0" r="26" fill="#E27386"/>
      <circle cx="0" cy="0" r="14" fill="#A32D3B"/>
      <circle cx="0" cy="0" r="6" fill="#FCEEEF"/>
      <!-- Leaves poking out -->
      <path d="M-30 10 C-50 20 -40 40 -20 30 Z" fill="#759C63"/>
      <path d="M10 -25 C20 -45 40 -35 30 -15 Z" fill="#759C63"/>
    </g>

    <!-- Item 3: Miniature Dried Floral Twigs &amp; Cotton Ball -->
    <g transform="translate(250, 190)">
      <circle cx="0" cy="0" r="16" fill="#FFFDF9" stroke="#E2D0C0" stroke-width="1.5"/>
      <circle cx="-5" cy="-4" r="6" fill="#F3E5D8"/>
      <line x1="0" y1="16" x2="0" y2="35" stroke="#9E8166" stroke-width="2"/>
    </g>

    <!-- Silk Satin Red Ribbon Wrapped Around Box Base -->
    <path d="M120 290 L250 345 L380 290" fill="none" stroke="url(#ribbonSilk)" stroke-width="14" stroke-linecap="round"/>
    <path d="M250 290 L250 400" fill="none" stroke="url(#ribbonSilk)" stroke-width="14"/>

    <!-- Luxurious Gift Bow at Front Center -->
    <g transform="translate(250, 345)">
      <path d="M-28 -14 C-45 -30 -50 0 -30 12 C-15 20 -5 5 0 0 C5 5 15 20 30 12 C50 0 45 -30 28 -14 C12 -2 5 2 0 0 C-5 2 -12 -2 -28 -14 Z" fill="url(#ribbonSilk)"/>
      <circle cx="0" cy="0" r="9" fill="#67111D"/>
      <!-- Trailing Ribbon Ends -->
      <path d="M-5 6 C-12 25 -25 45 -30 55" fill="none" stroke="#BA3343" stroke-width="5" stroke-linecap="round"/>
      <path d="M5 6 C12 25 25 45 30 55" fill="none" stroke="#BA3343" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
