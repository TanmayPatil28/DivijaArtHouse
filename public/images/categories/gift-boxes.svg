<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="discGradBoxes" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F5E3E6"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#discGradBoxes)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Artisan Gift Box Line-Art (Visiting Card Aesthetic) -->
  <g stroke="#781D2C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main Keepsake Box Body -->
    <rect x="155" y="235" width="190" height="150" rx="16" fill="#F8E7E9"/>
    
    <!-- Box Lid with Overhang -->
    <rect x="140" y="200" width="220" height="38" rx="10" fill="#FCF3F5"/>

    <!-- Vertical Ribbon -->
    <line x1="250" y1="200" x2="250" y2="385" stroke="#C59A5A" stroke-width="12"/>

    <!-- Horizontal Ribbon -->
    <line x1="155" y1="310" x2="345" y2="310" stroke="#C59A5A" stroke-width="8" stroke-dasharray="8,6"/>

    <!-- Ribbon Bow Knot &amp; Loops -->
    <g transform="translate(250, 200)">
      <!-- Left Bow Loop -->
      <path d="M0 0 C-40 -40 -60 10 -20 15 C-5 15 0 5 0 0 Z" fill="#F9ECEF"/>
      <!-- Right Bow Loop -->
      <path d="M0 0 C40 -40 60 10 20 15 C5 15 0 5 0 0 Z" fill="#F9ECEF"/>
      <!-- Center Ribbon Knot -->
      <circle cx="0" cy="5" r="12" fill="#781D2C" stroke="none"/>
      <circle cx="0" cy="5" r="5" fill="#C59A5A" stroke="none"/>
      <!-- Trailing Ribbon Ends -->
      <path d="M-8 15 C-25 45 -40 60 -50 75" stroke="#C59A5A" stroke-width="9"/>
      <path d="M8 15 C25 45 40 60 50 75" stroke="#C59A5A" stroke-width="9"/>
    </g>

    <!-- Miniature Heart Keepsake Accent -->
    <path d="M250 350 C242 340 230 345 230 355 C230 365 250 380 250 380 C250 380 270 365 270 355 C270 345 258 340 250 350 Z" fill="#C59A5A" stroke="none"/>
  </g>
</svg>
