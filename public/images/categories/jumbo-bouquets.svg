<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="discGradJumbo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F5E3E6"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#discGradJumbo)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Symmetrical 8-Petal Rangoli Rosette (Visiting Card 2nd Icon) -->
  <g stroke="#781D2C" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Gold Ring -->
    <circle cx="250" cy="250" r="32" stroke="#C59A5A" stroke-width="10" fill="#FDF6F8"/>
    <circle cx="250" cy="250" r="10" fill="#781D2C" stroke="none"/>

    <!-- Inner Rosette Loop Stitches (8-fold) -->
    <path d="M250 218 C235 185 265 185 250 218 Z" fill="#F7E4E7"/>
    <path d="M250 282 C235 315 265 315 250 282 Z" fill="#F7E4E7"/>
    <path d="M218 250 C185 235 185 265 218 250 Z" fill="#F7E4E7"/>
    <path d="M282 250 C315 235 315 265 282 250 Z" fill="#F7E4E7"/>

    <path d="M227 227 C198 202 220 180 227 227 Z" fill="#F7E4E7"/>
    <path d="M273 227 C302 202 280 180 273 227 Z" fill="#F7E4E7"/>
    <path d="M227 273 C198 298 220 320 227 273 Z" fill="#F7E4E7"/>
    <path d="M273 273 C302 298 280 320 273 273 Z" fill="#F7E4E7"/>

    <!-- Outer Grand Petals (Cardinal) -->
    <path d="M250 180 C215 130 285 130 250 180 Z"/>
    <path d="M250 320 C215 370 285 370 250 320 Z"/>
    <path d="M180 250 C130 215 130 285 180 250 Z"/>
    <path d="M320 250 C370 215 370 285 320 250 Z"/>

    <!-- Outer Diagonal Petals -->
    <path d="M200 200 C155 160 210 135 200 200 Z"/>
    <path d="M300 200 C345 160 290 135 300 200 Z"/>
    <path d="M200 300 C155 340 210 365 200 300 Z"/>
    <path d="M300 300 C345 340 290 365 300 300 Z"/>

    <!-- Outer Linking Crest Scallops -->
    <circle cx="250" cy="135" r="5" fill="#C59A5A" stroke="none"/>
    <circle cx="250" cy="365" r="5" fill="#C59A5A" stroke="none"/>
    <circle cx="135" cy="250" r="5" fill="#C59A5A" stroke="none"/>
    <circle cx="365" cy="250" r="5" fill="#C59A5A" stroke="none"/>
  </g>
</svg>
