<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJumbo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1EE"/>
      <stop offset="100%" stop-color="#EEDDD4"/>
    </linearGradient>
    <radialGradient id="luxGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EEDDD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldWrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E3C7"/>
      <stop offset="50%" stop-color="#DFBD8B"/>
      <stop offset="100%" stop-color="#BD9962"/>
    </linearGradient>
    <linearGradient id="roseLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22234"/>
      <stop offset="100%" stop-color="#67111D"/>
    </linearGradient>
    <linearGradient id="sunsetOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8A066"/>
      <stop offset="100%" stop-color="#DE602C"/>
    </linearGradient>
    <linearGradient id="goldenYarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D462"/>
      <stop offset="100%" stop-color="#D9A11B"/>
    </linearGradient>
    <linearGradient id="eucalyptus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CA38C"/>
      <stop offset="100%" stop-color="#4B705B"/>
    </linearGradient>
    <filter id="luxeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#552B1E" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="250" cy="250" r="230" fill="url(#bgJumbo)"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#DFBD8B" stroke-width="2" stroke-dasharray="5,5"/>
  <circle cx="250" cy="220" r="180" fill="url(#luxGlow)"/>

  <!-- Grand 24-Stem Multi-Floral Bouquet -->
  <g filter="url(#luxeShadow)">
    <!-- Broad Fan of Eucalyptus Leaves -->
    <path d="M120 220 C80 160 110 110 170 140 C180 170 150 210 120 220 Z" fill="url(#eucalyptus)"/>
    <path d="M380 220 C420 160 390 110 330 140 C320 170 350 210 380 220 Z" fill="url(#eucalyptus)"/>
    <path d="M180 150 C160 90 220 70 240 120 Z" fill="url(#eucalyptus)" opacity="0.85"/>
    <path d="M320 150 C340 90 280 70 260 120 Z" fill="url(#eucalyptus)" opacity="0.85"/>

    <!-- Luxe Triple-Folded Paper & Fabric Wrapping -->
    <path d="M250 440 L110 260 C110 260 180 290 250 290 C320 290 390 260 390 260 Z" fill="url(#goldWrap)"/>
    <path d="M110 260 L250 440 L280 288 C220 295 160 282 110 260 Z" fill="#997341" opacity="0.3"/>
    <!-- Black / Burgundy Inner Luxe Tissue Fold -->
    <path d="M130 255 L250 425 L370 255 C320 270 180 270 130 255 Z" fill="#2E1C1F" opacity="0.85"/>

    <!-- Floral Canopy of Stems -->
    <!-- Flower 1: Golden Sunflower (Top Center) -->
    <g transform="translate(250, 140)">
      <circle cx="0" cy="0" r="42" fill="url(#goldenYarn)"/>
      <!-- Petal spikes around -->
      <g stroke="#D9A11B" stroke-width="2" fill="#FCE182">
        <circle cx="0" cy="-35" r="10"/>
        <circle cx="25" cy="-25" r="10"/>
        <circle cx="35" cy="0" r="10"/>
        <circle cx="25" cy="25" r="10"/>
        <circle cx="0" cy="35" r="10"/>
        <circle cx="-25" cy="25" r="10"/>
        <circle cx="-35" cy="0" r="10"/>
        <circle cx="-25" cy="-25" r="10"/>
      </g>
      <circle cx="0" cy="0" r="22" fill="#5A3A1A"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#D9A11B" stroke-width="2" stroke-dasharray="3,3"/>
    </g>

    <!-- Flower 2: Luxe Crimson Velvet Rose (Center Left) -->
    <g transform="translate(170, 200)">
      <circle cx="0" cy="0" r="45" fill="url(#roseLuxe)"/>
      <path d="M-25 -15 C-5 -35 25 -30 30 -10 C35 15 15 35 -10 30 C-30 25 -35 0 -25 -15 Z" fill="none" stroke="#F5D6D9" stroke-width="3"/>
      <circle cx="0" cy="0" r="10" fill="#3D0B12"/>
    </g>

    <!-- Flower 3: Sunset Peach Peony (Center Right) -->
    <g transform="translate(330, 200)">
      <circle cx="0" cy="0" r="45" fill="url(#sunsetOrange)"/>
      <circle cx="0" cy="0" r="32" fill="#F5C09B" stroke="#DE602C" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="#DE602C"/>
      <circle cx="0" cy="0" r="8" fill="#FFFDF9"/>
    </g>

    <!-- Flower 4: Dusty Rose (Lower Center) -->
    <g transform="translate(250, 225)">
      <circle cx="0" cy="0" r="46" fill="#D47385"/>
      <circle cx="0" cy="0" r="32" fill="#F5B2C0" stroke="#B2475B" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="18" fill="#872430"/>
      <circle cx="0" cy="0" r="8" fill="#FCEEEF"/>
    </g>

    <!-- Small Baby Breath crochet florets filling edges -->
    <circle cx="140" cy="150" r="12" fill="#FFFDF9" stroke="#E2D0C0" stroke-width="1.5"/>
    <circle cx="360" cy="150" r="12" fill="#FFFDF9" stroke="#E2D0C0" stroke-width="1.5"/>
    <circle cx="205" cy="115" r="10" fill="#FFFDF9" stroke="#E2D0C0" stroke-width="1.5"/>
    <circle cx="295" cy="115" r="10" fill="#FFFDF9" stroke="#E2D0C0" stroke-width="1.5"/>

    <!-- Grand Double Satin Bow with Ribbons -->
    <g transform="translate(250, 360)">
      <path d="M-40 -15 C-70 -35 -80 5 -50 20 C-30 30 -10 10 -2 0 C10 10 30 30 50 20 C80 5 70 -35 40 -15 C20 -5 10 5 0 0 C-10 5 -20 -5 -40 -15 Z" fill="#A32D3B"/>
      <circle cx="0" cy="2" r="12" fill="#721B24"/>
      <!-- Trailing Ribbons -->
      <path d="M-8 10 C-20 40 -40 70 -50 90" fill="none" stroke="#A32D3B" stroke-width="7" stroke-linecap="round"/>
      <path d="M8 10 C20 40 40 70 50 90" fill="none" stroke="#A32D3B" stroke-width="7" stroke-linecap="round"/>
      <!-- Gold Accent Trim -->
      <circle cx="0" cy="2" r="5" fill="#DFBD8B"/>
    </g>
  </g>
</svg>
