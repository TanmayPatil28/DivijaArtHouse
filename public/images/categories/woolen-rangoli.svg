<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="woolenDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F7ECEE"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#woolenDisc)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Woolen Yarn & Pom-Pom Rangoli Art -->
  <g stroke="#781D2C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Pom-Pom -->
    <circle cx="250" cy="250" r="38" fill="#F8E6E9" stroke="#781D2C" stroke-width="7"/>
    <circle cx="250" cy="250" r="20" fill="#C59A5A" stroke="none"/>

    <!-- 8 Interlocking Woolen Yarn Loops -->
    <path d="M250 150 C210 150 210 210 250 210 C290 210 290 150 250 150 Z" fill="#FCF3F5" stroke="#781D2C" stroke-width="6"/>
    <path d="M250 350 C210 350 210 290 250 290 C290 290 290 350 250 350 Z" fill="#FCF3F5" stroke="#781D2C" stroke-width="6"/>
    <path d="M150 250 C150 210 210 210 210 250 C210 290 150 290 150 250 Z" fill="#FCF3F5" stroke="#781D2C" stroke-width="6"/>
    <path d="M350 250 C350 210 290 210 290 250 C290 290 350 290 350 250 Z" fill="#FCF3F5" stroke="#781D2C" stroke-width="6"/>

    <!-- Diagonal Yarn Loops -->
    <circle cx="180" cy="180" r="24" fill="#F8E6E9" stroke="#C59A5A" stroke-width="5"/>
    <circle cx="320" cy="180" r="24" fill="#F8E6E9" stroke="#C59A5A" stroke-width="5"/>
    <circle cx="180" cy="320" r="24" fill="#F8E6E9" stroke="#C59A5A" stroke-width="5"/>
    <circle cx="320" cy="320" r="24" fill="#F8E6E9" stroke="#C59A5A" stroke-width="5"/>

    <!-- Outer Woolen Pom-Pom Accents (Marigold & Crimson Motif) -->
    <circle cx="250" cy="100" r="14" fill="#C59A5A" stroke="#781D2C" stroke-width="5"/>
    <circle cx="250" cy="400" r="14" fill="#C59A5A" stroke="#781D2C" stroke-width="5"/>
    <circle cx="100" cy="250" r="14" fill="#C59A5A" stroke="#781D2C" stroke-width="5"/>
    <circle cx="400" cy="250" r="14" fill="#C59A5A" stroke="#781D2C" stroke-width="5"/>

    <!-- Braided Yarn Connecting Contour -->
    <circle cx="250" cy="250" r="160" stroke="#C59A5A" stroke-width="3" stroke-dasharray="8,6" opacity="0.6"/>
  </g>
</svg>
