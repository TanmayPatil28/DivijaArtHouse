<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F5E3E6"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#discGrad)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Line-Art Lotus Blossom Medallion (Visiting Card Inspired) -->
  <g stroke="#781D2C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Teardrop Petal -->
    <path d="M250 140 C220 200 220 270 250 310 C280 270 280 200 250 140 Z" fill="#FBF0F2"/>
    <circle cx="250" cy="235" r="8" fill="#C59A5A" stroke="none"/>

    <!-- Inner Left &amp; Right Petals -->
    <path d="M250 310 C180 300 150 220 185 170 C215 220 235 270 250 310 Z" fill="#F8E6E9"/>
    <path d="M250 310 C320 300 350 220 315 170 C285 220 265 270 250 310 Z" fill="#F8E6E9"/>

    <!-- Outer Flared Petals -->
    <path d="M250 310 C140 310 110 240 130 205 C160 250 200 290 250 310 Z"/>
    <path d="M250 310 C360 310 390 240 370 205 C340 250 300 290 250 310 Z"/>

    <!-- Calyx Base Arc &amp; Contour Stems -->
    <path d="M190 325 Q250 365 310 325" stroke-width="13"/>
    <path d="M250 345 L250 375" stroke="#C59A5A" stroke-width="10"/>

    <!-- Decorative Gold Accent Dots -->
    <circle cx="185" cy="170" r="5" fill="#C59A5A" stroke="none"/>
    <circle cx="315" cy="170" r="5" fill="#C59A5A" stroke="none"/>
    <circle cx="250" cy="140" r="6" fill="#C59A5A" stroke="none"/>
  </g>
</svg>
