<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="discGradMascot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F5E3E6"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#discGradMascot)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Character Gift / Amigurumi Bear Mascot Line-Art -->
  <g stroke="#781D2C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bear Head -->
    <circle cx="250" cy="240" r="95" fill="#F8E7E9"/>

    <!-- Left &amp; Right Rounded Ears -->
    <g>
      <circle cx="170" cy="160" r="34" fill="#F8E7E9"/>
      <circle cx="170" cy="160" r="16" fill="#C59A5A" stroke="none" opacity="0.7"/>
      <circle cx="330" cy="160" r="34" fill="#F8E7E9"/>
      <circle cx="330" cy="160" r="16" fill="#C59A5A" stroke="none" opacity="0.7"/>
    </g>

    <!-- Snout Muzzle Oval -->
    <ellipse cx="250" cy="265" rx="42" ry="32" fill="#FCF3F5" stroke-width="12"/>
    <!-- Triangular Embroidered Nose -->
    <path d="M238 252 Q250 246 262 252 Q250 264 238 252 Z" fill="#781D2C" stroke="none"/>
    <!-- Cute Smile -->
    <path d="M250 264 L250 278 M240 278 Q250 288 260 278" stroke-width="10"/>

    <!-- Eyes (Cute Dots with Highlights) -->
    <circle cx="210" cy="225" r="9" fill="#781D2C" stroke="none"/>
    <circle cx="290" cy="225" r="9" fill="#781D2C" stroke="none"/>

    <!-- Blush Cheeks -->
    <ellipse cx="185" cy="255" rx="14" ry="8" fill="#E8B8BC" stroke="none"/>
    <ellipse cx="315" cy="255" rx="14" ry="8" fill="#E8B8BC" stroke="none"/>

    <!-- Sunflower / Floret in Ear or Paw Accent -->
    <g transform="translate(325, 310)">
      <circle cx="0" cy="0" r="22" stroke="#C59A5A" stroke-width="10" fill="#FCF3F5"/>
      <circle cx="0" cy="0" r="9" fill="#781D2C" stroke="none"/>
      <!-- Tiny Petal Scallops -->
      <circle cx="0" cy="-22" r="5" fill="#C59A5A" stroke="none"/>
      <circle cx="22" cy="0" r="5" fill="#C59A5A" stroke="none"/>
      <circle cx="0" cy="22" r="5" fill="#C59A5A" stroke="none"/>
      <circle cx="-22" cy="0" r="5" fill="#C59A5A" stroke="none"/>
    </g>
  </g>
</svg>
