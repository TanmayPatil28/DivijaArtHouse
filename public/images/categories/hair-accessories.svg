<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="discGradHair" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCF3F5"/>
      <stop offset="100%" stop-color="#F5E3E6"/>
    </radialGradient>
  </defs>

  <!-- Blush Medallion Disc -->
  <circle cx="250" cy="250" r="236" fill="url(#discGradHair)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="#C59A5A" stroke-width="3" opacity="0.6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="#C59A5A" stroke-width="1.5" stroke-dasharray="6,5" opacity="0.45"/>

  <!-- Hair Accessories / Floral Hairpin Line-Art -->
  <g stroke="#781D2C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Double Fork Hairpin Stems -->
    <path d="M225 240 L210 395 C208 405 215 410 220 410 C225 410 230 405 235 395 L250 240" stroke="#C59A5A" stroke-width="11"/>
    <path d="M250 240 L265 395 C270 405 275 410 280 410 C285 410 292 405 290 395 L275 240" stroke="#C59A5A" stroke-width="11"/>

    <!-- Central Blossom Crown Cluster -->
    <g transform="translate(250, 190)">
      <!-- Central Crochet Bloom Petals (5-fold) -->
      <circle cx="0" cy="-35" r="18" fill="#F8E7E9"/>
      <circle cx="33" cy="-11" r="18" fill="#F8E7E9"/>
      <circle cx="21" cy="28" r="18" fill="#F8E7E9"/>
      <circle cx="-21" cy="28" r="18" fill="#F8E7E9"/>
      <circle cx="-33" cy="-11" r="18" fill="#F8E7E9"/>

      <!-- Center Gold Core Stamen -->
      <circle cx="0" cy="0" r="16" fill="#C59A5A" stroke="#781D2C" stroke-width="8"/>
      <circle cx="0" cy="0" r="5" fill="#FCF3F5" stroke="none"/>
    </g>

    <!-- Flanking Accent Florets &amp; Leaf Buds -->
    <!-- Left Leaf Bud -->
    <path d="M190 200 C150 185 145 150 165 140 C185 150 185 185 190 200 Z" stroke-width="11" fill="#FBF0F2"/>
    <circle cx="165" cy="140" r="5" fill="#C59A5A" stroke="none"/>

    <!-- Right Leaf Bud -->
    <path d="M310 200 C350 185 355 150 335 140 C315 150 315 185 310 200 Z" stroke-width="11" fill="#FBF0F2"/>
    <circle cx="335" cy="140" r="5" fill="#C59A5A" stroke="none"/>
  </g>
</svg>
